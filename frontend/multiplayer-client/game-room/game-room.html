<!DOCTYPE html>

<head>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <script type="module" src="game-client.js"></script>
    <script type="module" src="game-manager.js"></script>
    <script type="module" src="game-room.js"></script>
    <script type="module" src="gameboard.js"></script>
    <link rel="stylesheet" href="../../navbar.css">
    <link rel="stylesheet" href="game-room.css">
    <link rel="stylesheet" href="gameboard-styles.css">

</head>

<body>
    <nav class="classic-navbar">
        <a href="../../landing.html"><u>H</u>ome</a>
        <a href="../../help.html"><u>H</u>elp</a>
    </nav>
    <header>
        <h1 class="room-title">ROOM ID: <span id="room-id"></span><button id="copy-room-code" title="Copy Room Code">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <rect x="9" y="9" width="13" height="13" rx="1" ry="1"></rect>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                </svg>
            </button></h1>
        <button id="copy-join-link">Copy Join Link</button>
        <h1 id="roomDisplay" style="font-size: 1.2rem; margin-top: 10px;">CONNECTING...</h1>
    </header>

    <div id="waiting-indicator">
        Waiting for the host to start the game...
    </div>

    <div id="chat">
        <h1 id="chatHeader">CHAT</h1>
        <div id="message-container"></div>
        <div id="chat-inputs">
            <input id="message-input" autocomplete="off"><button id="sendChat">SEND</button>
        </div>
    </div>

    <main id="gameArea">
        <div class="container">
            <p id="gamemode"></p>
            <div class="game-stats">
                <span id="timer">000</span>
                <span id="bomb-counter">000</span>
                <span id="flag-counter">000</span>
            </div>
            <div class="flagControls">
                <button id="toggle-flag">FLAG (SHFT)</button>
            </div>
            <div id="grid"></div>
        </div>
    </main>
    <footer class="classic-footer">
        By Osereme Ibazebo <a href="https://www.oseremeibazebo.dev" target="_blank">www.oseremeibazebo.dev</a>
    </footer>
</body>
